<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FATALITY | Магазин</title>
    <style>
        /* Базовые настройки */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            width: 100%;
            overflow-x: hidden; /* Убирает горизонтальную прокрутку */
            background-color: #0a0a0a;
            color: #ffffff;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Фоновое свечение */
        .glow-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(138, 43, 226, 0.15) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        /* Навигация */
        header {
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(138, 43, 226, 0.3);
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #8a2be2, 0 0 20px #8a2be2;
            letter-spacing: 2px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(45deg, #6a0dad, #8a2be2);
            color: white;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.5);
        }

        .btn-outline {
            background: transparent;
            color: #b388ff;
            border: 2px solid #8a2be2;
        }

        /* Главный экран */
        .hero {
            text-align: center;
            padding: 50px 15px;
            max-width: 800px;
            width: 100%;
        }

        .hero h1 {
            font-size: 32px; /* Уменьшили для телефонов */
            line-height: 1.2;
            margin-bottom: 15px;
            background: linear-gradient(to right, #ffffff, #b388ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 15px;
            color: #a0a0a0;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .hero-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Секция с обзором */
        .section-title {
            text-align: center;
            font-size: 24px;
            margin: 40px 0 20px;
            color: #fff;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1200px;
            padding: 0 15px;
            margin-bottom: 50px;
        }

        .gallery-item {
            background: #111;
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 12px;
            padding: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            object-fit: contain; /* Не обрезает фото */
        }

        /* Модальное окно */
        .modal {
            display: none; 
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
            cursor: zoom-out;
        }
        
        .modal-content {
            margin: auto;
            display: block;
            max-width: 95%;
            max-height: 95vh;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 8px;
        }

        /* Цены */
        .pricing {
            display: flex;
            flex-direction: column; /* На телефоне друг под другом */
            gap: 15px;
            padding: 0 15px;
            width: 100%;
            max-width: 350px;
            margin-bottom: 50px;
        }

        .price-card {
            background: #111;
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            width: 100%;
        }

        .price-card h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #b388ff;
        }

        .price {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #fff;
        }

        .price span {
            font-size: 16px;
            color: #666;
        }

        /* Футер */
        footer {
            width: 100%;
            text-align: center;
            padding: 20px;
            color: #666;
            border-top: 1px solid rgba(138, 43, 226, 0.2);
            font-size: 12px;
        }

        /* Адаптация для больших экранов (ПК) */
        @media (min-width: 768px) {
            header { padding: 20px 50px; }
            .logo { font-size: 24px; }
            .btn { padding: 10px 24px; font-size: 16px; }
            .hero { padding: 100px 20px; }
            .hero h1 { font-size: 64px; }
            .hero p { font-size: 20px; margin-bottom: 40px; }
            .hero-buttons { gap: 20px; }
            .section-title { font-size: 36px; margin: 80px 0 40px; }
            .gallery { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 0 20px; }
            .gallery-item { padding: 10px; }
            .pricing { flex-direction: row; max-width: 100%; gap: 30px; }
            .price-card { max-width: 300px; padding: 40px; }
            .price-card h3 { font-size: 24px; margin-bottom: 20px; }
            .price { font-size: 48px; margin-bottom: 30px; }
            .price span { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <header>
        <div class="logo">FATALITY</div>
        <a href="https://t.me/espachov" class="btn btn-outline" target="_blank">Телеграм</a>
    </header>

    <main>
        <section class="hero">
            <h1>ЛУЧШИЙ ЧИТ ДЛЯ STANDOFF</h1>
            <p>Незаметный софт, максимальная производительность. ESP, Aimbot и полный обход античита.</p>
            
            <div class="hero-buttons">
                <a href="https://t.me/espachov" class="btn btn-primary" target="_blank">Купить чит</a>
                <a href="https://t.me/cheathard" class="btn btn-outline" target="_blank">Перейти в ТГК</a>
            </div>
        </section>

        <h2 class="section-title">Обзор софта</h2>
        <div class="gallery">
            <div class="gallery-item" onclick="openModal(this)">
                <img src="https://i.postimg.cc/vxdVmbCJ/photo-1-2026-10-18-18-17-28.jpg" alt="Скриншот 1">
            </div>
            <div class="gallery-item" onclick="openModal(this)">
                <img src="https://i.postimg.cc/vxdVmbpF/photo-2-2026-10-18-18-17-28.jpg" alt="Скриншот 2">
            </div>
            <div class="gallery-item" onclick="openModal(this)">
                <img src="https://via.placeholder.com/600x400/1a1a1a/8a2be2?text=Menu" alt="Menu">
            </div>
        </div>

        <h2 class="section-title">Прайс-лист</h2>
        <div class="pricing">
            <div class="price-card" style="border-color: #8a2be2; box-shadow: 0 0 20px rgba(138,43,226,0.2);">
                <h3>На месяц</h3>
                <div class="price">200 <span>₽</span></div>
                <a href="https://t.me/espachov" class="btn btn-primary" target="_blank">Купить</a>
            </div>

            <div class="price-card">
                <h3>Навсегда</h3>
                <div class="price">400 <span>₽</span></div>
                <a href="https://t.me/espachov" class="btn btn-primary" target="_blank">Купить</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 FATALITY. Все права защищены.</p>
    </footer>

    <!-- Модальное окно -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <img class="modal-content" id="modalImg">
    </div>

    <script>
        function openModal(element) {
            var imgSrc = element.querySelector('img').src;
            var modal = document.getElementById("imageModal");
            var modalImg = document.getElementById("modalImg");
            modal.style.display = "block";
            modalImg.src = imgSrc;
        }

        function closeModal() {
            document.getElementById("imageModal").style.display = "none";
        }
    </script>

</body>
</html>
