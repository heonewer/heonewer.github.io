<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FATALITY | Магазин</title>
    <style>
        /* Сброс стилей */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden; /* Запрет горизонтального скролла */
            background-color: #0a0a0a;
            color: #ffffff;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Фоновое свечение */
        .glow-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(138, 43, 226, 0.15) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
        }

        /* Навигация */
        header {
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 10, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(138, 43, 226, 0.3);
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px #8a2be2;
            letter-spacing: 1px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            white-space: nowrap; /* Кнопка не переносит текст внутри себя */
            transition: 0.3s;
        }

        .btn-primary {
            background: linear-gradient(45deg, #6a0dad, #8a2be2);
            color: white;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.5);
        }

        .btn-outline {
            background: transparent;
            color: #b388ff;
            border: 2px solid #8a2be2;
        }

        /* Главный экран */
        .hero {
            text-align: center;
            padding: 40px 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero h1 {
            font-size: 32px;
            line-height: 1.3;
            margin-bottom: 15px;
            background: linear-gradient(to right, #ffffff, #b388ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            word-wrap: break-word; /* Перенос длинных слов */
        }

        .hero p {
            font-size: 15px;
            color: #a0a0a0;
            margin-bottom: 30px;
            line-height: 1.5;
            max-width: 600px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap; /* Кнопки переносятся на новую строку, если не влезают */
            width: 100%;
        }

        /* Заголовки секций */
        .section-title {
            text-align: center;
            font-size: 24px;
            margin: 40px 0 20px;
            color: #fff;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
        }

        /* Галерея */
        .gallery {
            display: grid;
            grid-template-columns: 1fr; /* На телефоне 1 колонка */
            gap: 15px;
            width: 100%;
            max-width: 1000px;
            padding: 0 20px;
            margin-bottom: 40px;
        }

        .gallery-item {
            background: #111;
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 12px;
            padding: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        /* Модальное окно */
        .modal {
            display: none; 
            position: fixed;
            z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.95);
            cursor: zoom-out;
        }
        
        .modal-content {
            margin: auto;
            display: block;
            max-width: 95%;
            max-height: 95vh;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 8px;
        }

        /* Прайс-лист */
        .pricing {
            display: flex;
            flex-direction: column; /* На телефоне друг под другом */
            align-items: center;
            gap: 20px;
            width: 100%;
            padding: 0 20px;
            margin-bottom: 60px;
        }

        .price-card {
            background: #111;
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            width: 100%;
            max-width: 350px;
        }

        .price-card h3 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #b388ff;
        }

        .price {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #fff;
        }

        .price span {
            font-size: 18px;
            color: #666;
        }

        /* Футер */
        footer {
            width: 100%;
            text-align: center;
            padding: 20px;
            color: #666;
            border-top: 1px solid rgba(138, 43, 226, 0.2);
            font-size: 12px;
            margin-top: auto;
        }

        /* Адаптация для ПК (экраны от 768px) */
        @media (min-width: 768px) {
            header { padding: 20px 50px; }
            .logo { font-size: 24px; }
            .btn { padding: 10px 24px; font-size: 16px; }
            .hero { padding: 80px 20px; }
            .hero h1 { font-size: 56px; }
            .hero p { font-size: 18px; }
            .section-title { font-size: 32px; margin: 60px 0 30px; }
            .gallery { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
            .pricing { flex-direction: row; justify-content: center; gap: 30px; }
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <header>
        <div class="logo">FATALITY</div>
        <a href="https://t.me/espachov" class="btn btn-outline" target="_blank">Телеграм</a>
    </header>

    <main style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <section class="hero">
            <h1>ЛУЧШИЙ ЧИТ ДЛЯ STANDOFF</h1>
            <p>Незаметный софт, максимальная производительность. ESP, Aimbot и полный обход античита.</p>
            
            <div class="hero-buttons">
                <a href="https://t.me/espachov" class="btn btn-primary" target="_blank">Купить чит</a>
                <a href="https://t.me/cheathard" class="btn btn-outline" target="_blank">Перейти в ТГК</a>
            </div>
        </section>

        <h2 class="section-title">Обзор софта</h2>
        <div class="gallery">
            <div class="gallery-item" onclick="openModal(this)">
                <img src="https://i.postimg.cc/vxdVmbCJ/photo-1-2026-10-18-18-17-28.jpg" alt="Скриншот 1">
            </div>
            <div class="gallery-item" onclick="openModal(this)">
                <img src="https://i.postimg.cc/vxdVmbpF/photo-2-2026-10-18-18-17-28.jpg" alt="Скриншот 2">
            </div>
            <div class="gallery-item" onclick="openModal(this)">
                <img src="https://via.placeholder.com/600x400/1a1a1a/8a2be2?text=Menu" alt="Menu">
            </div>
        </div>

        <h2 class="section-title">Прайс-лист</h2>
        <div class="pricing">
            <div class="price-card" style="border-color: #8a2be2; box-shadow: 0 0 20px rgba(138,43,226,0.2);">
                <h3>На месяц</h3>
                <div class="price">200 <span>₽</span></div>
                <a href="https://t.me/espachov" class="btn btn-primary" target="_blank">Купить</a>
            </div>

            <div class="price-card">
                <h3>Навсегда</h3>
                <div class="price">400 <span>₽</span></div>
                <a href="https://t.me/espachov" class="btn btn-primary" target="_blank">Купить</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 FATALITY. Все права защищены.</p>
    </footer>

    <!-- Модальное окно -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <img class="modal-content" id="modalImg">
    </div>

    <script>
        function openModal(element) {
            var imgSrc = element.querySelector('img').src;
            var modal = document.getElementById("imageModal");
            var modalImg = document.getElementById("modalImg");
            modal.style.display = "block";
            modalImg.src = imgSrc;
        }

        function closeModal() {
            document.getElementById("imageModal").style.display = "none";
        }
    </script>

</body>
</html>
